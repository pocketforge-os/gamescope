name: CI

on:
  push:
    branches: [pocketforge]
  pull_request:
    branches: [pocketforge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamescope-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pf-public-isolation-probe:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-public-ci]
    steps:
      - name: Check out the tested public revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Verify pinned public probe inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/pf-public-probe/test-vendored-inputs.py \
            --root "$GITHUB_WORKSPACE"
          python3 .github/ci/pf-public-probe/test-workflow-policy.py \
            --root "$GITHUB_WORKSPACE"

      - name: Run live public isolation probe and negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/pf-public-probe/run-probe-and-controls.py \
            --probe .github/ci/pf-public-probe/vendor/pf-public-job-probe.py \
            --config .github/ci/pf-public-probe/vendor/runner-pool-probe-contract.json \
            --live

  native-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-public-ci]
    container: archlinux:base-devel
    env:
      MESON_SOURCE_CACHE_ROOT: ${{ github.workspace }}/.ci-source-closure/${{ github.run_id }}/${{ github.run_attempt }}/native-tests/cache
      MATERIALIZED_SOURCE_ROOT: ${{ github.workspace }}/.ci-source-closure/${{ github.run_id }}/${{ github.run_attempt }}/native-tests/source
      MATERIALIZATION_RECEIPT: ${{ github.workspace }}/.ci-source-closure/${{ github.run_id }}/${{ github.run_attempt }}/native-tests/materialization-receipt.json
      MISSING_SOURCE_ROOT: ${{ github.workspace }}/.ci-source-closure/${{ github.run_id }}/${{ github.run_attempt }}/native-tests/missing-source
    steps:
      - name: Prepare build environment
        run: |
          pacman-key --init
          pacman -Syu --noconfirm
          pacman -S --noconfirm ca-certificates curl git meson glslang libcap sdl2 vulkan-headers vulkan-icd-loader \
            libx11 libxmu libxcomposite libxrender libxres libxtst \
            libxkbcommon libdrm libinput wayland-protocols benchmark \
            xorg-xwayland pipewire cmake libavif libheif aom rav1e \
            libdecor libxdamage lcms2 seatd \
            xcb-util-wm xcb-util-renderutil xcb-util-errors \
            luajit catch2

      - name: Check out the tested public revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Admit and materialize the controlled source closure
        shell: bash
        run: |
          set -euo pipefail
          cold_result="$(.github/scripts/prime-meson-sources.sh)"
          printf '%s\n' "$cold_result"
          grep -Fx 'cache_result=cold' <<<"$cold_result"
          grep -Fx 'validated_edges=34' <<<"$cold_result"
          grep -Fx 'verified_sources=32' <<<"$cold_result"

          warm_result="$(PF_MESON_CACHE_OFFLINE=1 .github/scripts/prime-meson-sources.sh)"
          printf '%s\n' "$warm_result"
          grep -Fx 'cache_result=warm' <<<"$warm_result"
          grep -Fx 'validated_edges=34' <<<"$warm_result"
          grep -Fx 'verified_sources=32' <<<"$warm_result"

          manifest_sha="$(sha256sum .github/pocketforge-source-closure.tsv | awk '{print $1}')"
          admission_receipt="$MESON_SOURCE_CACHE_ROOT/$manifest_sha/admission-receipt.json"
          test -f "$admission_receipt"
          sha256sum \
            .github/pocketforge-source-closure.tsv \
            .github/vendored-sources.tsv \
            "$admission_receipt"

          python3 .github/scripts/materialize-source-closure.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$GITHUB_WORKSPACE/.github/pocketforge-source-closure.tsv" \
            --vendored-registry "$GITHUB_WORKSPACE/.github/vendored-sources.tsv" \
            --cache-root "$MESON_SOURCE_CACHE_ROOT/$manifest_sha" \
            --output "$MATERIALIZED_SOURCE_ROOT" \
            --receipt "$MATERIALIZATION_RECEIPT"
          sha256sum "$MATERIALIZATION_RECEIPT"

          python3 .github/scripts/materialize-source-closure.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$GITHUB_WORKSPACE/.github/pocketforge-source-closure.tsv" \
            --vendored-registry "$GITHUB_WORKSPACE/.github/vendored-sources.tsv" \
            --cache-root "$MESON_SOURCE_CACHE_ROOT/$manifest_sha" \
            --output "$MISSING_SOURCE_ROOT" \
            --receipt "${MATERIALIZATION_RECEIPT%.json}-missing.json"

      - name: Prove incomplete admission and materialization fail closed
        shell: bash
        run: |
          set -euo pipefail
          manifest_sha="$(sha256sum .github/pocketforge-source-closure.tsv | awk '{print $1}')"
          missing_cache_root="${MESON_SOURCE_CACHE_ROOT}-missing"
          corrupt_cache_root="${MESON_SOURCE_CACHE_ROOT}-corrupt"
          install -d "$missing_cache_root/$manifest_sha" "$corrupt_cache_root/$manifest_sha"
          cp -a "$MESON_SOURCE_CACHE_ROOT/$manifest_sha/." "$missing_cache_root/$manifest_sha/"
          cp -a "$MESON_SOURCE_CACHE_ROOT/$manifest_sha/." "$corrupt_cache_root/$manifest_sha/"

          missing_repo="$missing_cache_root/$manifest_sha/repos/glm.git"
          test -d "$missing_repo"
          find "$missing_repo" -mindepth 1 -delete
          rmdir "$missing_repo"
          if PF_MESON_CACHE_OFFLINE=1 \
            MESON_SOURCE_CACHE_ROOT="$missing_cache_root" \
            .github/scripts/prime-meson-sources.sh; then
            echo 'an incomplete offline cache was accepted' >&2
            exit 1
          fi

          corrupt_repo="$corrupt_cache_root/$manifest_sha/repos/glm.git"
          test -d "$corrupt_repo"
          python3 - "$corrupt_repo" <<'PY'
          import pathlib
          import sys

          objects = [path for path in (pathlib.Path(sys.argv[1]) / "objects").rglob("*") if path.is_file()]
          if not objects:
              raise SystemExit("no Git objects available to corrupt")
          for path in objects:
              path.chmod(path.stat().st_mode | 0o200)
              path.write_bytes(b"corrupt\n")
          PY
          if PF_MESON_CACHE_OFFLINE=1 \
            MESON_SOURCE_CACHE_ROOT="$corrupt_cache_root" \
            .github/scripts/prime-meson-sources.sh; then
            echo 'a corrupted offline cache was accepted' >&2
            exit 1
          fi

      - name: Prove a missing materialized source blocks Meson
        shell: bash
        working-directory: ${{ env.MISSING_SOURCE_ROOT }}
        run: |
          set -euo pipefail
          test -d subprojects/glm
          find subprojects/glm -mindepth 1 -delete
          rmdir subprojects/glm
          export CC=gcc CXX=g++
          if meson setup build-wrap-red \
            --wrap-mode=nodownload \
            -Dinput_emulation=disabled \
            -Denable_openvr_support=false \
            --force-fallback-for=libdisplay-info,libliftoff,vkroots,wlroots \
            --werror \
            --auto-features=enabled \
            > wrap-red.log 2>&1; then
            cat wrap-red.log
            echo 'Meson accepted a missing required wrap archive' >&2
            exit 1
          fi
          cat wrap-red.log
          grep -F 'ERROR: Automatic wrap-based subproject downloading is disabled' wrap-red.log

      - name: Build and run native tests
        shell: bash
        working-directory: ${{ env.MATERIALIZED_SOURCE_ROOT }}
        run: |
          set -euo pipefail
          export CC=gcc CXX=g++
          meson setup build-native \
            --wrap-mode=nodownload \
            -Dinput_emulation=disabled \
            -Denable_openvr_support=false \
            --force-fallback-for=libdisplay-info,libliftoff,vkroots,wlroots \
            --werror \
            --auto-features=enabled
          meson compile -C build-native
          meson test -C build-native --suite gamescope --print-errorlogs
          meson test -C build-native --suite libdisplay-info --print-errorlogs
          meson test -C build-native --suite libliftoff --print-errorlogs
          meson test -C build-native --list > build-native/registered-tests.txt
          python3 .github/scripts/assert-test-registration.py \
            --list-file build-native/registered-tests.txt

  aarch64-build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-public-ci]
    container: debian:trixie-slim
    env:
      MESON_SOURCE_CACHE_ROOT: ${{ github.workspace }}/.ci-source-closure/${{ github.run_id }}/${{ github.run_attempt }}/aarch64-build/cache
      MATERIALIZED_SOURCE_ROOT: ${{ github.workspace }}/.ci-source-closure/${{ github.run_id }}/${{ github.run_attempt }}/aarch64-build/source
      MATERIALIZATION_RECEIPT: ${{ github.workspace }}/.ci-source-closure/${{ github.run_id }}/${{ github.run_attempt }}/aarch64-build/materialization-receipt.json
    steps:
      - name: Prepare aarch64 cross environment
        shell: bash
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git file meson ninja-build cmake pkg-config \
            crossbuild-essential-arm64 glslang-tools wayland-protocols hwdata \
            libwayland-bin xwayland:arm64 \
            libx11-dev:arm64 libx11-xcb-dev:arm64 \
            libxdamage-dev:arm64 libxcomposite-dev:arm64 \
            libxcursor-dev:arm64 libxrender-dev:arm64 libxext-dev:arm64 \
            libxfixes-dev:arm64 libxxf86vm-dev:arm64 libxtst-dev:arm64 \
            libxres-dev:arm64 libxmu-dev:arm64 libxi-dev:arm64 \
            libdrm-dev:arm64 libwayland-dev:arm64 libxkbcommon-dev:arm64 \
            liblcms2-dev:arm64 \
            libcap-dev:arm64 libsdl2-dev:arm64 libpixman-1-dev:arm64 \
            libudev-dev:arm64 libseat-dev:arm64 libdecor-0-dev:arm64 \
            libinput-dev:arm64 libxcb1-dev:arm64 libxcb-composite0-dev:arm64 \
            libxcb-ewmh-dev:arm64 libxcb-icccm4-dev:arm64 \
            libxcb-res0-dev:arm64 libxcb-xfixes0-dev:arm64 \
            libluajit-5.1-dev:arm64 libvulkan-dev:arm64
          find /var/lib/apt/lists -mindepth 1 -delete

      - name: Check out the tested public revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Admit and materialize the controlled source closure
        shell: bash
        run: |
          set -euo pipefail
          cold_result="$(.github/scripts/prime-meson-sources.sh)"
          printf '%s\n' "$cold_result"
          grep -Fx 'cache_result=cold' <<<"$cold_result"
          grep -Fx 'validated_edges=34' <<<"$cold_result"
          grep -Fx 'verified_sources=32' <<<"$cold_result"

          warm_result="$(PF_MESON_CACHE_OFFLINE=1 .github/scripts/prime-meson-sources.sh)"
          printf '%s\n' "$warm_result"
          grep -Fx 'cache_result=warm' <<<"$warm_result"
          grep -Fx 'validated_edges=34' <<<"$warm_result"
          grep -Fx 'verified_sources=32' <<<"$warm_result"

          manifest_sha="$(sha256sum .github/pocketforge-source-closure.tsv | awk '{print $1}')"
          admission_receipt="$MESON_SOURCE_CACHE_ROOT/$manifest_sha/admission-receipt.json"
          test -f "$admission_receipt"
          sha256sum \
            .github/pocketforge-source-closure.tsv \
            .github/vendored-sources.tsv \
            "$admission_receipt"

          python3 .github/scripts/materialize-source-closure.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$GITHUB_WORKSPACE/.github/pocketforge-source-closure.tsv" \
            --vendored-registry "$GITHUB_WORKSPACE/.github/vendored-sources.tsv" \
            --cache-root "$MESON_SOURCE_CACHE_ROOT/$manifest_sha" \
            --output "$MATERIALIZED_SOURCE_ROOT" \
            --receipt "$MATERIALIZATION_RECEIPT"
          sha256sum "$MATERIALIZATION_RECEIPT"

      - name: Build Gamescope for aarch64
        shell: bash
        working-directory: ${{ env.MATERIALIZED_SOURCE_ROOT }}
        run: |
          set -euo pipefail
          install -d /usr/local/libexec
          printf '%s\n' \
            '#!/bin/sh' \
            'export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig' \
            'exec pkg-config "$@"' \
            > /usr/local/libexec/aarch64-pkg-config
          chmod +x /usr/local/libexec/aarch64-pkg-config
          printf '%s\n' \
            '[binaries]' \
            "c = 'aarch64-linux-gnu-gcc'" \
            "cpp = 'aarch64-linux-gnu-g++'" \
            "ar = 'aarch64-linux-gnu-gcc-ar'" \
            "strip = 'aarch64-linux-gnu-strip'" \
            "pkg-config = '/usr/local/libexec/aarch64-pkg-config'" \
            '' \
            '[properties]' \
            'needs_exe_wrapper = true' \
            '' \
            '[host_machine]' \
            "system = 'linux'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" \
            > aarch64.ini
          meson setup build-aarch64 \
            --cross-file aarch64.ini \
            --wrap-mode=nodownload \
            -Dpipewire=disabled \
            -Drt_cap=disabled \
            -Ddrm_backend=enabled \
            -Dsdl2_backend=enabled \
            -Davif_screenshots=disabled \
            -Dinput_emulation=disabled \
            -Denable_openvr_support=false \
            -Denable_tests=false \
            -Dbenchmark=disabled \
            --force-fallback-for=libdisplay-info,libliftoff,vkroots,wlroots
          meson compile -C build-aarch64
          file build-aarch64/src/gamescope | grep -F 'ARM aarch64'
